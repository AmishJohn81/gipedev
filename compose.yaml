services:
  api:
    build:
      context: .
      dockerfile: api/GipeDev.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DatabaseProvider: Sqlite
      ConnectionStrings__GipeDev: Data Source=/app/data/gipedev.db;Default Timeout=30
    ports:
      - "10000:10000"
    volumes:
      - gipedev-data:/app/data

volumes:
  gipedev-data:
