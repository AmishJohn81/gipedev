services:
  api:
    build:
      context: .
      dockerfile: api/GipeDev.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__GipeDev: Host=database;Port=5432;Database=gipedev;Username=gipedev;Password=gipedev
    ports:
      - "10000:10000"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gipedev
      POSTGRES_USER: gipedev
      POSTGRES_PASSWORD: gipedev
    volumes:
      - gipedev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gipedev -d gipedev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gipedev-postgres:
